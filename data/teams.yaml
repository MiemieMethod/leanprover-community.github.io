- name: mathlib 审阅者
  short_description: "mathlib 审阅团队协助 mathlib 维护者进行 mathlib 拉取请求的日常审阅。该团队由在贡献与审阅中展现出高质量的资深社区成员组成。"
  description: "mathlib 审阅团队协助 mathlib 维护者进行 mathlib 拉取请求的日常审阅。该团队由在贡献与审阅中展现出高质量的资深社区成员组成。在一项拉取请求的审阅过程中，他们会留下评论与反馈。一旦他们认为某项拉取请求已准备好合并，便会将其放入队列，等待 mathlib 维护者进行最终审阅并下达合并指令。"
