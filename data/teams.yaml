- name: mathlib 维护者
  short_description: mathlib 维护者有权批准对 mathlib 的更改与新增内容。该团队负责 mathlib 的整体设计，旨在维护库的连贯性，并使其各部分良好地整合在一起。
  description: |
    mathlib 库正处于活跃开发之中，任何时刻都有数百项提议中的更改与新增内容在讨论之中，每周有数十项获得批准。这些提议以 [mathlib Github 仓库上的"拉取请求"](https://github.com/leanprover-community/mathlib4/pulls)的形式组织。mathlib 维护者是有权对拉取请求给予最终批准的人。他们必须确保 mathlib 拥有连贯的设计与高质量的实现。

    mathlib 维护者通常在某个数学或计算机科学领域拥有研究级别的知识。社区成员经由当届维护者邀请而成为维护者，任何人都可以通过向当届维护者发送消息来提名一位社区成员。维护者任期为两年，可续任，预期任期会得到续展，除非该维护者已不再活跃或希望卸任。
