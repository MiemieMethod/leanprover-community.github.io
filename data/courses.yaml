- name: Lean learning group 2023
  instructor: Patrick Kinnear
  institution: Glasgow-Maxwell School
  website: https://www.maths.ed.ac.uk/~pkinnear/leancourse/
  summary: >
    一门为期一学期的课程，面向爱丁堡、赫瑞-瓦特（Heriot-Watt）和格拉斯哥大学代数及相关主题的研究生。
    旨在以数学家和未来形式化者的身份接触 Lean，确立对策略模式的熟练掌握。
    在课程的第一部分，我们使用 tutorials 项目学习 Lean 中一阶逻辑的基础，
    随后讨论一些类型与类型类的基础知识，以谈论代数的形式化。课程还使用了 lftcm2020 练习单和 MiL。
