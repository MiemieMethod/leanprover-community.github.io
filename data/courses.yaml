  experiences: >
    我们尝试避免在早期过多涉及类型论，以让人们快速、自信地与 Lean 交互。
    现在回头看，更深入地涵盖这部分内容本会更好（尽管只在课程后期、在确立了与 Lean 交互的信心之后），
    这有助于应对在形式化一段有趣的数学时不可避免会出现的问题。
    此外，我们最初将课程成果设定为开展贡献 mathlib 的小组项目，
