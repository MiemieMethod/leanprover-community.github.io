  experiences: >
    我的计划是先现场编程，然后清理、补充文档并用 DocGen4 生成讲义。
    在头一个月里，这一做法效果非常好，伴有大量提问以及我对解释的随机调整。
    一旦项目开始，讲座与考核的脱钩导致出勤率急剧下降。
    我作出了调整，将讲座变为项目演示/答疑/现场编程。
    进度较快的学生讲解他们已完成的工作，进度较慢的则讲解他们已有的内容、
    卡在何处、需要什么等等，而我（以及他们的同学）帮助他们摆脱困境。
    这一做法效果良好。下次我讲授时，会更早且更有计划地过渡到这种模式。
