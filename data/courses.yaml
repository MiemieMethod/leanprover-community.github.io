  lean_version: 4
  summary: >
    本课程旨在向学生介绍 Lean 4 与形式化数学。
    我们主要聚焦于 Lean 的基础及其底层的类型论。
    学生将同时练习使用项与策略，以证明简单的命题并解决基础任务。
    在课程的最后一部分，我们将从 Mathlib 中选取若干主题，并演示如何使用它们。
  experiences: >
    本课程将于 2026 年 2 月起首次向学生开设。
