- name: "Computer-Verified Proof: A Hands-On Introduction to Interactive Theorem Proving"
  instructor: Emily Riehl
  institution: Johns Hopkins University
  year: 2025
  lean_version: 4
  summary: >
    这是一门面向 12 名自选学生的一年级研讨课，这些学生未必打算主修数学，课程描述如下：千百年来，数学家们发展出一套日益精确的逻辑推理体系，用以判定何为某一数学命题的有效证明。但纸笔证明可能包含难以察觉的微妙错误。这门一年级研讨课将提供对一种全新证明撰写方法的实践入门，其中逻辑论证是借助一种称为计算机证明助手的工具与计算机交互式地展开的，该工具同时检查底层的逻辑。通过一系列游戏，我们将探索计算机证明助手 Lean，同时学习如何陈述、解释并证明日益复杂的定理。本课程还将讨论形式化方法在验证软件与硬件方面的实际应用，以及这种颠覆性的证明撰写方法对数学研究所产生的影响。
  website: https://adam.math.hhu.de/#/g/emilyriehl/ReintroductionToProofs
  material: https://infinitedescent.xyz/
  repo: https://github.com/emilyriehl/ReintroductionToProofs
