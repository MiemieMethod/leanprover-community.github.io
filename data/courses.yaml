  website: https://github.com/sergunchik/ementas/blob/master/lean-pt.md
  lean_version: 3
  tags: ['logic', 'intro to proof', 'Portuguese']
  summary: >
    我在疫情期间（2021 年 8 月至 12 月）
    为巴西里约热内卢天主教大学（PUC-Rio，de Moura 的母校）数学系
    一组精选的本科生
    在线讲授了本课程（通过 Zoom + Telegram + GitHub）。
    课程包含 LEAN 的实践部分，例如
    Buzzard 的 'Natural Number Game'
      （学生必须完成所有关卡，然后在 LEAN 本体中学习策略模式），
    以及 Avigad、Lewis 和 van Doorn 所著教科书《Logic and proofs》
      （学生须通过 GitHub 提交所有问题的解答，并学习普通模式），
      课堂上还进行现场编程与屏幕共享，
    以及相当分量的理论/口头部分：命题逻辑、集合、类型、范畴、Curry-Howard-Lambek 对应，外加一些原创材料。
  experiences: >
    本课程是对 Vladimir Uspensky 和 Vladimir Voevodsky 的纪念。
    我努力让它至少像他们的课程和科普工作那样有趣且发人深省。
    各种概念从不同的视角和诠释反复呈现，
    因此，有些出乎我意料的是，有时一些学生凭手指就记得某个证明，能够在 LEAN 中解出问题，
    但在脑海中却不行，需要额外的时间来消化某个数学抽象。
    若要扩大此类课程的规模，则必须合成更多的问题。
