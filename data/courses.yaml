# 本文件中的条目应包含以下字段：
#
# `name`：课程的标题
# `instructor`：讲授该课程的个人或团队的姓名
# `institution`：讲授该课程的机构名称
# `year`：该课程最近一次讲授的年份
# `lean_version`：3 或 4，即该课程最近一次开设时所用的 Lean 版本
# `summary`：对课程所涵盖内容及所做工作的描述
# `tags`：标签列表（见下文）
# `website`（可选）：课程主页
# `material`（可选）：指向教科书、课程讲义等的链接
# `repo`（可选）：指向课程项目仓库的链接，例如位于 GitHub 上
# `experiences`（可选）：关于课程开展情况的反思、可以有所改进之处等
# `language`（可选）：若授课语言不是英语，则注明所用语言
#
# 请使用网站上展示的标签。特别地，每个条目都应有一个
# 总体学科标签（`mathematics`、`logic`、`computer science`）。
#
# 此列表没有特定顺序。可在任意位置添加新条目。
