- name: "Formal Proofs and Software Verification"
  instructor: Alexandre Rademaker
  institution: Fundação Getulio Vargas
  year: 2025
  lean_version: 4
  tags: ['computer science','portuguese','formal verification','functional programming']
  summary: >
    交互式证明器（即证明助手）是用于验证程序正确性与数学形式化的工具。与模型检查器和 SAT 求解器等工具不同，证明助手具有高度的交互性。经机器检查的形式化证明能够带来可靠且数学上严谨的程序。本课程通过 Lean 向学生介绍证明助手的理论与使用。我们将使用 Lean 来验证函数式程序的性质与数学定理。我们将学习演绎推理的理论以及这些工具所依据的逻辑。我们采用了《The Hitchhiker's Guide to Logical Verification》一书。
  website: https://github.com/emap-20252-fm
  material: https://github.com/emap-20252-fm/syllabus
- name: "Algorithms and Data Structures"
  instructor: Alexandre Rademaker
  institution: Fundação Getulio Vargas
  year: 2024
  lean_version: 4
  tags: ['computer science','portuguese','functional programming', 'data structures']
  summary: >
    本课程涵盖算法设计的原理：分治法、贪心算法、归约、动态规划、穷举搜索等等。这些原理通过 Lean 这一纯函数式语言加以呈现，相比通常用命令式语言所得的程序，它能给出更简单的解释和更短的程序。在 Lean 中，正如在 Haskell 和其他函数式语言中一样，算法开发在适用时采用等式推理；本课程阐明了其适用条件以及正确性的论证。
  website: https://github.com/emap-20242-ed/syllabus
  material: https://github.com/arademaker/fad  
