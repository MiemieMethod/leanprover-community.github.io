#   # 必须是 'tutorial'、'how-to'、'reference'、'explanation' 之一。参见：https://docs.divio.com/documentation-system/
#   # 如果它无法明确地归入任何类别，请选择最接近的一个。你也可以尝试链接到各个具体小节。
#   category: tutorial
#   # 规范标签列表请参见上方。
#   tags:
#     - elementary
#     - nonmathlib

