# 使用说明：
# 本列表收集了网络上所有可用的 Mathlib 文档资源。
# 如果你知道符合标准的有用资源，欢迎将其添加到列表中！
# 检查标准时，请自问该资源是否：
# * 聚焦于 Mathlib？
#   （而非：它适用于任何 Lean 项目，或只是简短提及 Mathlib。）
# * 保持最新？
#   （而非：它只适用于 Lean 3，对新版 Mathlib 已无关紧要。）
# * 由 Mathlib 社区发布？
#   （而非：某人的博客文章。）
# * 被社区普遍推荐为资源？
#   （而非：它只适用于 Lean 3。）
# 如果你有几个"是"的回答，那么你的资源很可能符合标准。
#
# 我们力求遵循 Divio（https://docs.divio.com/documentation-system/）将文档分为四类的分类法：
# * 用于学习的教程（用于研习；实践步骤）。
#   教程是手把手带领读者完成一系列步骤，从而完成某种项目的课程。
# * 用于解决问题的操作指南（用于工作；实践步骤）。
#   操作指南带领读者完成解决现实问题所需的步骤。
# * 用于查阅信息的参考（用于工作；理论知识）。
#   参考指南是对机制及其操作方式的技术性描述。
# * 用于理解的说明（用于研习；理论知识）。
#   说明，或讨论，阐明并照亮某个特定主题。
#
# 规范标签列表：
tags:
  # 数学主题：
  - name: analysis
    description: 数学分析（含微积分）
  - name: category theory
    description: 范畴论
  - name: differential geometry
    description: 微分几何
  - name: elementary
    description: "初等数学：入门逻辑、集合论、自然数与整数。"
  - name: euclidean geometry
    description: "欧几里得几何"
  - name: group theory
    description: 幺半群与群。
  - name: linear algebra
    description: 模与向量空间。
  - name: logic
    description: "数理逻辑：基础、经典与直觉主义逻辑、集合论、类型论。"
  - name: measure theory
    description: "测度论。另见：probability。"
  - name: probability
    description: "概率论。另见：measure theory。"
  - name: ring theory
    description: 环与域。
  - name: topology
    description: 拓扑与拓扑代数。
  # 技术主题：
  - name: declarations
    description: 描述声明（`def`、`theorem` 等）及其类型。
  - name: development
    description: 如何在你的计算机上编辑和构建文件，如何将你的修改贡献给 Mathlib，以及如何运行持续集成。
  - name: classes
    description: 类型类、实例以及实例层级。
  - name: linters
    description: "现有的 linter 及其使用方法。另见：metaprogramming。"
  - name: metaprogramming
    description: "开发新的元程序。并非关于现有 linter 和策略的使用。另见：linters、tactics。"
  - name: tactics
    description: "现有的策略及其使用方法。另见：metaprogramming。"
# # 更多主题：
  - name: programming
    description: 将 Lean 用作（经过验证的）编程语言。
  - name: teaching
    description: 使用 Lean 教授数学专业的学生。
# # 元信息：
  - name: historical
    description: "由于语言/风格/设计的变化已不再有用。此条目为完整性而保留，可能是撰写新文档的有用起点。"
    display: false
  - name: incomplete
    description: 参考性作品，（有意地）仅包含可用信息的一部分。
  - name: Lean 3
    description: "面向 Lean 3。另见：historical。"
    display: false
  - name: nonmathlib
    description: "不以符合 Mathlib 约定为目标：使用不同的风格，或使用其自身的定义而非 Mathlib 的定义。"
  - name: normative
    description: 为 Mathlib 社区定义需遵循的标准（而非记录别处设定的标准）。

