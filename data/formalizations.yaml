 title: Polynomial Freiman-Ruzsa conjecture
 authors: Tao et al
 abstract: |
           这是加性组合学中一个著名的猜想，其解答于 2023 年 11 月宣布，
           并借助一个大型协作项目在三周内完成了形式化。
 url: https://teorth.github.io/pfr/
 organization: teorth
 repo: pfr
-
 title: Cedar specification
 authors: Emina Torlak et al
 abstract: |
           Cedar 是一种用于将权限定义为策略的语言，这些策略描述了谁应当
           访问什么。它同时也是一份用于求值这些策略的规范。该规范已被形式化，
           并且其在 Lean 中的实现被用来通过对比来检验其 Rust 实现。
 url: https://github.com/cedar-policy/cedar-spec/tree/main/cedar-lean
 organization: cedar-policy
 repo: cedar-spec
- 
 title: Cairo verification
 authors: Avigad
 abstract: |
           Cairo 是一种基于区块链的编程语言。该语言及其库的多个组成部分
           已被形式化。
