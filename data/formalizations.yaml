 title: Liquid Tensor Experiment
 authors: Commelin, Topaz et al
 abstract: |
           Liquid 向量空间是 Clausen 与 Scholze 的凝聚态数学框架中的关键
           对象，该框架融合了数论与泛函分析。关于它们的主定理保证了它们具有
           实现这一目标所需的适当性质。
 url: https://leanprover-community.github.io/liquid/
 organization: leanprover-community
 repo: lean-liquid
-
 title: The sphere eversion
 authors: Massot, Nash, van Doorn
 abstract: |
           Smale 著名的球面翻转定理保证了你可以在欧氏三维空间中将一个球面
           里外翻转。它是 Gromov 提出的一个更为一般的柔性结果的一个特例。
           它的形式化表明，证明助手并不局限于数学中的代数部分，也能够处理
           微分拓扑。
 url: https://leanprover-community.github.io/sphere-eversion/
 organization: leanprover-community
 repo: sphere-eversion
- 
