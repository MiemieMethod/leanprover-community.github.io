- 
  title: The cap-set problem
  authors: Dahmen, Hölzl and Lewis
  abstract: |
            2016 年，Ellenberg 与 Gijswijt 给出了 $𝔽^n_q$ 中不含三项等差
            数列的子集大小的一个新的上界。这一问题受到了数学界的广泛关注，
            尤其是在 $q = 3$ 的情形，此时它通常被称为 cap set 问题。
            Ellenberg 与 Gijswijt 的证明发表于《Annals of Mathematics》，
            其巧妙地运用初等方法这一点尤为引人注目。
  url: https://lean-forward.github.io/e-g/
  organization: lean-forward
  repo: cap_set_problem
-
  title: Perfectoid spaces
  authors: Buzzard, Commelin and Massot
  abstract: |
            Perfectoid 空间是算术几何中由 Peter Scholze 于 2012 年引入的
            复杂对象。我们在拓扑、代数与几何中形式化了足够多的定义与定理，
            从而在 Lean 定理证明器中定义出 perfectoid 空间。这一实验证实了
            证明助手能够处理这一方向上的复杂性，而这与形式化一个关于简单对象
            的冗长证明颇为不同。
  url: https://leanprover-community.github.io/lean-perfectoid-spaces/
  organization: leanprover-community
  repo: lean-perfectoid-spaces
-
  title: Independence of the continuum hypothesis
  authors: Han and van Doorn
  abstract: |
            连续统假设断言：在最小的无穷基数与连续统的基数之间不存在其他基数。
            它由 Cantor 于 1878 年提出，是 Hilbert 列出的二十三个数学
            未解难题中的第一个。Gödel 与 Cohen 证明了它是独立的，即从 ZFC
            出发既不可证明也不可否证。
  url: https://flypitch.github.io/
  organization: flypitch
  repo: flypitch
- 
  title: Data Types as Quotients of Polynomial Functors
  authors: Avigad, Carneiro and Hudon
  abstract: |
            一大类数据类型，包括归纳类型的任意嵌套、余归纳类型以及商类型，
            都可以表示为多项式函子的商。这为在交互式定理证明器中构造它们
            并对其进行推理提供了清晰明了的方式。
  url: https://github.com/avigad/qpf
  organization: avigad
  repo: qpf
